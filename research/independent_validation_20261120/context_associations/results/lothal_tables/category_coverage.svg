ght="23" fill="#d28b38"/><text x="683" y="230" font-family="sans-serif" font-size="14">21 (14 joined / 7 missing)</text><text x="12" y="262" font-family="sans-serif" font-size="15">Leather sack</text><rect x="190" y="244" width="23" height="23" fill="#287e78"/><rect x="213" y="244" width="23" height="23" fill="#d28b38"/><text x="246" y="262" font-family="sans-serif" font-size="14">2 (1 joined / 1 missing)</text><text x="12" y="294" font-family="sans-serif" font-size="15">Basket</text><rect x="190" y="276" width="23" height="23" fill="#287e78"/><rect x="213" y="276" width="0" height="23" fill="#d28b38"/><text x="223" y="294" font-family="sans-serif" font-size="14">1 (1 joined / 0 missing)</text><text x="12" y="326" font-family="sans-serif" font-size="15">Single rope</text><rect x="190" y="308" width="23" height="23" fill="#287e78"/><rect x="213" y="308" width="0" height="23" fill="#d28b38"/><text x="223" y="326" font-family="sans-serif" font-size="14">1 (1 joined / 0 missing)</text><text x="12" y="358" font-family="sans-serif" font-size="15">Other types</text><rect x="190" y="340" width="23" height="23" fill="#287e78"/><rect x="213" y="340" width="23" height="23" fill="#d28b38"/><text x="246" y="358" font-family="sans-serif" font-size="14">2 (1 joined / 1 missing)</text><text x="12" y="390" font-family="sans-serif" font-size="15">Undiagnostic</text><rect x="190" y="372" width="299" height="23" fill="#287e78"/><rect x="489" y="372" width="115" height="23" fill="#d28b38"/><text x="614" y="390" font-family="sans-serif" font-size="14">18 (13 joined / 5 missing)</text><rect x="190" y="428" width="17" height="17" fill="#287e78"/><text x="216" y="442" font-family="sans-serif" font-size="14">Existing inscription</text><rect x="405" y="428" width="17" height="17" fill="#d28b38"/><text x="431" y="442" font-family="sans-serif" font-size="14">Missing transcription</text></svg>